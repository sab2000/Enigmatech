name: enigmator_techno
description: Military-grade file encryption with premium UX
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Security Core
  crypto: ^3.0.3
  shared_preferences: ^2.2.2
  
  # Enhanced UI
  intl: ^0.19.0
  universal_html: ^2.2.1
  url_launcher: ^6.1.7
  flutter_dotenv: ^5.0.2
  animations: ^2.0.7
  shimmer: ^2.0.0
  glassmorphism: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.4

flutter:
  uses-material-design: true
  generate: true
  
  assets:
    - web/password-gen.html
    - assets/images/
    - .env  # Environment variables file

  web:
    runtime: release
    builders:
      universal_html:
        generate_for: ["web/**"]