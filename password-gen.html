<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Password Generator</title>
  <script src="https://cdn.jsdelivr.net/npm/js-sha256@0.9.0/build/sha256.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      height: 100vh;
      justify-content: center;
      align-items: center;
      background: #f3f3f3;
    }
    .box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      width: 320px;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
    }
    .output {
      background: #eee;
      padding: 10px;
      text-align: center;
      font-weight: bold;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h3>Password Generator</h3>
    <label for="mode">Duration:</label>
    <select id="mode">
      <option value="daily">Daily</option>
      <option value="weekly">Weekly</option>
      <option value="monthly">Monthly</option>
      <option value="yearly">Yearly</option>
    </select>
    <label for="extra">Extra Input:</label>
    <input id="extra" placeholder="e.g. ytt33" />
    <button onclick="generate()">Generate</button>
    <div id="result" class="output">Password will appear here</div>
    <button onclick="copy()">Copy Password</button>
  </div>

  <script>
    function formatDate(mode) {
      const now = new Date();
      if (mode === 'weekly') {
        const diff = now.getDate() - now.getDay();
        now.setDate(diff);
      } else if (mode === 'monthly') {
        now.setDate(1);
      } else if (mode === 'yearly') {
        now.setMonth(0);
        now.setDate(1);
      }
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}${m}${d}`;
    }

    function generate() {
      const salt = "E1x@2025#";
      const mode = document.getElementById('mode').value;
      const extra = document.getElementById('extra').value;
      const date = formatDate(mode);
      const hash = sha256(salt + date + extra);
      const pwd = hash.substring(0, 12);
      document.getElementById('result').textContent = pwd;
    }

    function copy() {
      const pwd = document.getElementById('result').textContent;
      navigator.clipboard.writeText(pwd);
      alert("Copied to clipboard!");
    }
  </script>
</body>
</html>
